[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "v4-core/=lib/v4-core/src/",
  "@uniswap/v4-core/src/=lib/v4-core/src/",
  "forge-std/=lib/forge-std/src/",
  "solmate/=lib/solmate/",
]


[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"

[lint]
lint_on_build = false
